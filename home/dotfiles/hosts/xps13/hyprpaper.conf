# hyprpaper ≥ 0.8 syntax: one `wallpaper` block per output, no `preload`.

# No splash quips at the bottom of the wallpaper (see main-pc's copy).
splash = false

# Empty monitor = every output, so an external screen gets the wallpaper too.
# The image is linked into place by home/modules/desktop-xps13.nix.
wallpaper {
  monitor =
  path = ~/Pictures/wallpapers/hole.jpeg
}
