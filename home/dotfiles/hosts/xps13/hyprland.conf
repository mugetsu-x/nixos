# xps13's part of the Hyprland config, sourced by ../../hypr/hyprland.conf as
# ~/.config/hypr/host.conf: the built-in panel, touchpad, touchscreen and the
# brightness keys.

# 13.3" 1080p panel. Scale 1.25 gives a 1536x864 workspace; at 1 the text is
# too small to read comfortably. The internal panel is always eDP-1 on Intel
# graphics, so matching by name is safe here (unlike main-pc's DP-n).
monitor=eDP-1,1920x1080@60,0x0,1.25

input {
  touchpad {
    natural_scroll = true
    tap-to-click = true
    clickfinger_behavior = true   # two-finger click = right click
    disable_while_typing = true
  }

  # Keep the touchscreen mapped to the built-in panel when an external monitor
  # is attached.
  touchdevice {
    output = eDP-1
  }
}

# Three-finger horizontal swipe switches workspace.
gesture = 3, horizontal, workspace

# Brightness keys. `e` repeats while held, `l` also works on the lock screen.
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
