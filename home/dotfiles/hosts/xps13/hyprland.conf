# xps13's part of the Hyprland config, sourced by ../../hypr/hyprland.conf as
# ~/.config/hypr/host.conf: the built-in panel, touchpad, touchscreen and the
# brightness keys.

# 13.3" 1080p panel. Scale 1.25 gives a 1536x864 workspace; at 1 the text is
# too small to read comfortably. The internal panel is always eDP-1 on Intel
# graphics, so matching by name is safe here (unlike main-pc's DP-n).
#
# auto-center-down puts it centred below the external screen when one is
# attached, and at 0x0 when it is alone, so no position needs recomputing when
# the external screen's mode or scale changes.
monitor=eDP-1,1920x1080@60,auto-center-down,1.25

# Samsung U32R59x, 32" 4K, on the desk. The XPS 13 has only a mini
# DisplayPort; through the mDP→HDMI adapter it shows up as HDMI-A-1 and tops
# out at 1080p (a passive DP++ adapter is capped at 165 MHz, 4K@30 needs 297
# and 4K@60 594; forcing 3840x2160 falls back to 1080p). On an mDP→DP cable the
# 3840x2160@60 mode appears and `highres` picks it up with no edit here.
# Matched by description: the connector name differs between the two cables.
monitor=desc:Samsung Electric Company U32R59x HNMNA00711,highres,0x0,auto

input {
  touchpad {
    natural_scroll = true
    tap-to-click = true
    clickfinger_behavior = true   # two-finger click = right click
    disable_while_typing = true
  }

  # Keep the touchscreen mapped to the built-in panel when an external monitor
  # is attached.
  touchdevice {
    output = eDP-1
  }
}

# Three-finger horizontal swipe switches workspace.
gesture = 3, horizontal, workspace

# Brightness keys. `e` repeats while held, `l` also works on the lock screen.
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
