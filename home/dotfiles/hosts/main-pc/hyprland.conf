# main-pc's part of the Hyprland config, sourced by ../../hypr/hyprland.conf as
# ~/.config/hypr/host.conf: the monitors, the Wacom tablet and mouse scrolling.

# Monitors. The 1080p Dell sits *below* the ultrawide, horizontally centred
# under it: (3440 - 1920) / 2 = 760, and y = 1440 is the bottom of the ultrawide.
#
# Matched by EDID description (`desc:`), not connector name: NVIDIA driver
# updates renumber the DP-n connectors (615.78 turned DP-2/DP-4 into DP-1/DP-3),
# and a stale name silently drops both panels to auto layout at 60 Hz.
# `hyprctl monitors` prints the description. waybar, hyprpaper and mpvpaper
# (home/modules/desktop-main-pc.nix) match on the same strings.
#
# Rates are pinned, not `preferred` — the EDID-preferred mode is only 60 Hz on
# both panels, well under what they can actually do.
#
# VRR is enabled on the ultrawide only, and as `2` (fullscreen windows only),
# not `1` (always). It is a QD-OLED: an always-on variable refresh rate makes it
# flicker on the desktop, where the frame rate lurches between ~1 Hz (idle) and
# 165 Hz (a blinking cursor). Fullscreen-only keeps it to games, which is the
# only place it helps anyway.
monitor=desc:Dell Inc. AW3423DWF J2872S3,3440x1440@164.90,0x0,1,vrr,2
monitor=desc:Dell Inc. DELL P2426H FHVRYD4,1920x1080@120.00,760x1440,1

input {
  # Hold middle button and move the mouse to scroll; a plain click still
  # middle-clicks (paste, close tab). 274 = BTN_MIDDLE.
  scroll_method = on_button_down
  scroll_button = 274

  # Wacom Intuos S (152x95 mm). No driver to install: the kernel's `wacom`
  # module + libinput handle it and Hyprland speaks tablet-v2 to clients
  # (pressure included). All that is configured here is the mapping.
  tablet {
    # Pinned to the small panel, by EDID description like everything else.
    output = desc:Dell Inc. DELL P2426H FHVRYD4

    # The tablet is 16:10, the panel 16:9. Mapped whole, circles come out as
    # ovals — so use only a 16:9 slice of it: full width, 152 * 9/16 = 85.5 mm
    # high, centred ((95 - 85.5) / 2 = 4.75 mm unused top and bottom).
    active_area_size = 152 85.5
    active_area_position = 0 4.75
  }
}

# Wacom pen buttons. Stock Hyprland cannot bind these at all — a local patch
# (modules/patches/hyprland-tablet-button-binds.patch) offers them to the bind
# system under mouse-button names: mouse:331 is the lower button (BTN_STYLUS,
# nearer the tip), mouse:332 the upper one (BTN_STYLUS2).
# Lower = undo, sent as Ctrl+Z to the focused window. The upper button is left
# unbound on purpose, so it reaches the app as before.
bind = , mouse:331, sendshortcut, CTRL, Z, activewindow
