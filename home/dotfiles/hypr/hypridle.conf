# Idle handling. Lock at 10 min, screens off at 15, lock before suspend.
#
# Everything goes through `loginctl lock-session` rather than calling hyprlock
# directly, so a lock requested by logind (suspend, `loginctl lock-session`)
# and one from the idle timer take the same path. `pidof hyprlock ||` stops a
# second instance stacking on top of an existing lock.
#
# Apps that hold an idle inhibitor (mpv, Chrome playing video, Steam games)
# suppress these timers — that is hypridle's default, not configured here.

general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

listener {
  timeout = 900
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}
