# hyprpaper ≥ 0.8 syntax: one `wallpaper` block per output, no `preload`.

# hyprpaper draws Hyprland's random splash quips ("by dt, do you mean damage
# tracking or distrotube?") at the bottom of the wallpaper on its own —
# `misc:disable_splash_rendering` in hyprland.conf does not cover it.
splash = false

# Ultrawide only, on purpose. A wildcard monitor would claim the 1080p panel too
# and fight mpvpaper (see home/modules/wayland.nix) over that output's
# background layer. Matched by description, not DP-n (see hyprland.conf).
wallpaper {
  monitor = desc:Dell Inc. AW3423DWF J2872S3
  path = ~/Pictures/wallpapers/hole.jpeg
}
