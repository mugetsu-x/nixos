# hyprpaper ≥ 0.8 syntax: one `wallpaper` block per output, no `preload`.

# DP-2 only, on purpose. A wildcard monitor would claim DP-4 too and fight
# mpvpaper (see home/modules/wayland.nix) over that output's background layer.
wallpaper {
  monitor = DP-2
  path = ~/Pictures/wallpapers/hole.jpeg
}
